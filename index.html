<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>LinkDit Pad</title>
    <meta name="description" content="The next generation Windows writing application." />
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('linkdit-pad-theme-mode');
          var theme = localStorage.getItem('linkdit-pad-theme');
          var accent = localStorage.getItem('linkdit-pad-accent');
          var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.setAttribute('data-theme', theme || 'arctic');
          root.setAttribute('data-accent', accent || 'blue');
        } catch(e) {
          var r = document.documentElement;
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) { r.classList.add('dark'); }
          r.setAttribute('data-theme', 'arctic');
          r.setAttribute('data-accent', 'blue');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
